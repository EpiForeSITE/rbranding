# ForeSITE pkgdown theme
#
# Usage (see ../README.md for details):
#   1. Copy `foresite_themes/_brand.yml` and `foresite_themes/assets/` into
#      your package (e.g., under `pkgdown/brand/`), and add that folder to
#      `.Rbuildignore`.
#   2. Merge the settings below into your package's `_pkgdown.yml`, adjusting
#      `url` and the `brand` path.
#   3. Build with `pkgdown::build_site()` (requires pkgdown >= 2.1.0 and the
#      brand.yml R package).

url: https://epiforesite.github.io/<package>/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    brand: pkgdown/brand/_brand.yml

navbar:
  bg: light

footer:
  structure:
    left: [developed_by, foresite]
    right: built_with
  components:
    foresite: >-
      Part of the [ForeSITE](https://github.com/EpiForeSITE) software
      ecosystem. This project was made possible by cooperative agreement
      CDC-RFA-FT-23-0069 from the CDC's Center for Forecasting and Outbreak
      Analytics. Its contents are solely the responsibility of the authors and
      do not necessarily represent the official views of the Centers for
      Disease Control and Prevention.
